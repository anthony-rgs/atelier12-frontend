    <!-- Local business structured data — helps Google surface address/phone/hours directly
         in search results. Hours mirror what's set in Strapi at the time of writing; update
         here too if they change materially, since this block can't fetch live data. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "HairSalon",
        "name": "L'Atelier 12",
        "url": "https://latelier12.fr",
        "image": "https://latelier12.fr/images/favicon.png",
        "telephone": "+33147075928",
        "priceRange": "€€",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "12 rue Geoffroy-Saint-Hilaire",
          "postalCode": "75005",
          "addressLocality": "Paris",
          "addressCountry": "FR"
        },
        "geo": {
          "@type": "GeoCoordinates",
          "latitude": 48.8393676,
          "longitude": 2.3546398
        },
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"],
            "opens": "09:00",
            "closes": "18:00"
          }
        ]
      }
    </script>
  </head>
